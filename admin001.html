<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>VEACASY Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#14202e;--mut:#667385;--line:#dde3ea;--blue:#2196F3;--red:#d33;--amb:#e8a100;--grn:#1a9b57}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--mut:#93a0b0;--line:#2b3644}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:14px;max-width:760px;margin:auto}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:15px;margin:22px 0 8px}
input,select,button{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--blue);color:#fff;border:0;font-weight:600}button.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.r{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.st b{display:block;font-size:20px}.st span{font-size:11px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.card.flag{border-color:var(--amb)}.card.off{opacity:.8;border-color:var(--red)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mut{color:var(--mut);font-size:12.5px}.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line)}
.bar{display:flex;gap:8px;margin:10px 0}.bar input{flex:1;min-width:0}#err{color:var(--red);margin:8px 0}textarea{width:100%;height:90px}
.lw{min-height:80vh;display:flex;align-items:center;justify-content:center}.lc{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;box-shadow:0 8px 28px rgba(0,0,0,.08)}.lc h1{margin:10px 0 4px;font-size:21px}.lg{width:46px;height:46px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.lc label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 5px}.lc input{width:100%}.pwr{display:flex;gap:6px}.big{width:100%;margin-top:18px;padding:12px}.er{color:var(--red);font-size:13px;margin:10px 0 0;min-height:18px}</style></head><body>
<div id="login" class="lw"><div class="lc">
<div class="lg">VA</div><h1>Admin sign in</h1><p class="mut">Restricted area. Authorized access only.</p>
<label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="you@example.com">
<label for="pw">Password</label><div class="pwr"><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button type="button" class="g" id="tg">Show</button></div>
<button id="go" class="big">Sign in</button><p id="lerr" class="er"></p></div></div>
<div id="app" style="display:none">
<h1>VEACASY Admin <button class="g" id="out" style="float:right;font-size:12px">Log out</button></h1>
<div class="stats" id="stats"></div>
<div class="bar"><input id="q" placeholder="Search name, link, WhatsApp, email"><select id="f"><option value="all">All</option><option value="flag">Flagged</option><option value="trial">Trial</option><option value="paid">Paid</option><option value="off">Expired / blocked</option></select></div>
<div id="list"></div>
<h2>Generate plan codes</h2>
<div class="bar"><select id="cp"><option value="basic">Basic</option><option value="ceo">CEO</option><option value="custom">Custom</option></select><input id="cd" type="number" value="365" placeholder="Days"><input id="cn" type="number" value="1" min="1" max="50"><button id="cg">Create</button></div>
<textarea id="cout" readonly placeholder="New codes appear here. Copy and send them on WhatsApp."></textarea>
<h2>Recent codes</h2><div id="codes"></div>
</div><p id="err"></p>
<script>
const sb=supabase.createClient("https://bfirghwabailetfuepyh.supabase.co","sb_publishable_eKf6tIadS8Fq-wzSTl95hw_UcrELF5p",{auth:{persistSession:true,storage:window.sessionStorage}});
const $=id=>document.getElementById(id);let rows=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const days=d=>d?Math.ceil((new Date(d)-Date.now())/864e5):null;
const fail=e=>{const m=e&&e.message?e.message:String(e);($("app").style.display==="block"?$("err"):$("lerr")).textContent=m};
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$("login").style.display="block";$("app").style.display="none";return}
const{data,error}=await sb.rpc("admin_list_stores");if(error){fail(error);await sb.auth.signOut();$("login").style.display="block";$("app").style.display="none";return}
$("err").textContent="";$("lerr").textContent="";$("login").style.display="none";$("app").style.display="block";rows=data||[];draw();codes()}
function kind(r){return !r.is_active?"off":r.plan==="trial"?"trial":"paid"}
function draw(){const n=Date.now(),day=864e5;const c=k=>rows.filter(r=>kind(r)===k).length;
$("stats").innerHTML=[["Stores",rows.length],["Trials",c("trial")],["Paid",c("paid")],["Expired/blocked",c("off")],["New 24h",rows.filter(r=>n-new Date(r.created_at)<day).length],["Flagged",rows.filter(r=>r.same_whatsapp>1).length]].map(x=>`<div class="st"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");
const q=$("q").value.toLowerCase(),f=$("f").value;
$("list").innerHTML=rows.filter(r=>(f==="all"||(f==="flag"?r.same_whatsapp>1:kind(r)===f))&&(!q||[r.business_name,r.slug,r.whatsapp_number,r.email].some(v=>String(v||"").toLowerCase().includes(q)))).map(r=>{const d=days(r.plan==="trial"?r.trial_ends_at:r.expires_at);
return`<div class="card ${r.same_whatsapp>1?"flag":""} ${r.is_active?"":"off"}"><b>${esc(r.business_name)}</b> <span class="chip">${esc(r.plan)}${r.status!=="active"?" · "+esc(r.status):""}</span>
<div class="mut"><a href="/${esc(r.slug)}/" target="_blank">/${esc(r.slug)}</a> · ${r.product_count}/${r.product_limit} products${d!==null?" · "+(d<0?"ended":d+"d left"):""}<br>${esc(r.whatsapp_number)} · ${esc(r.email)}<br>Joined ${new Date(r.created_at).toLocaleDateString()}${r.same_whatsapp>1?` · <b style="color:var(--amb)">⚠ ${r.same_whatsapp} stores share this WhatsApp</b>`:""}</div>
<div class="row"><button class="g" onclick="plan('${r.id}')">Plan</button><button class="g" onclick="blk('${r.id}',${r.status==="suspended"})">${r.status==="suspended"?"Unblock":"Block"}</button><button class="r" onclick="del('${r.id}','${esc(r.slug)}')">Delete</button></div></div>`}).join("")||'<p class="mut">No stores match.</p>'}
async function act(p){const{error}=await sb.rpc(...p);if(error)return fail(error);boot()}
window.plan=id=>{const v=prompt("Set plan and days, e.g.  basic 365   or   ceo 365   or   trial 14   (leave days out for no expiry)");if(!v)return;const[a,b]=v.trim().split(/\s+/);act(["admin_update_store",{p_id:id,p_plan:a.toLowerCase(),p_days:b?parseInt(b):null}])};
window.blk=(id,un)=>{if(confirm((un?"Unblock":"Block")+" this store?"))act(["admin_update_store",{p_id:id,p_status:un?"active":"suspended"}])};
window.del=async(id,slug)=>{if(prompt('This permanently deletes the store, its photos, products and login. Type "'+slug+'" to confirm:')!==slug)return;
const{data:urls}=await sb.rpc("admin_store_photos",{p_id:id});
const paths=(urls||[]).map(u=>{const k=u.indexOf("/product-photos/");return k<0?null:decodeURIComponent(u.slice(k+16).split("?")[0])}).filter(Boolean);
for(let k=0;k<paths.length;k+=100){const{error}=await sb.storage.from("product-photos").remove(paths.slice(k,k+100));if(error)return fail(error)}
act(["admin_delete_store",{p_id:id}])};
async function codes(){const{data,error}=await sb.rpc("admin_list_codes");if(error)return fail(error);$("codes").innerHTML=(data||[]).map(c=>`<div class="mut"><b style="color:var(--ink)">${esc(c.code)}</b> · ${esc(c.plan)} · ${c.days??"∞"}d · ${c.used?"used":"unused"}</div>`).join("")||'<p class="mut">No codes yet.</p>'}
$("cg").onclick=async()=>{const{data,error}=await sb.rpc("admin_generate_codes",{p_plan:$("cp").value,p_days:parseInt($("cd").value)||null,p_count:parseInt($("cn").value)||1});if(error)return fail(error);$("cout").value=data.join("\n");codes()};
$("tg").onclick=()=>{const s=$("pw").type==="password";$("pw").type=s?"text":"password";$("tg").textContent=s?"Hide":"Show"};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("go").onclick=async()=>{$("lerr").textContent="";$("go").disabled=true;$("go").textContent="Signing in...";const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});$("go").disabled=false;$("go").textContent="Sign in";if(error)return fail(error);boot()};
$("out").onclick=async()=>{await sb.auth.signOut();boot()};$("q").oninput=draw;$("f").onchange=draw;boot();
</script></body></html>
