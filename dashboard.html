<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veacasy — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<style>
  :root{
    --ink:#1E2B22;
    --paper:#EEF3EC;
    --panel:#FAFBF7;
    --accent:#2196F3; /* new-signup default — blue, until a seller picks their own */
    --line:#CBD9CD;
    --muted:#6E7C71;
    /* Fixed Veacasy brand colors — the login/signup screen always uses these two,
       never the dynamic --accent tokens above, regardless of any vendor's theme. */
    --brand-blue:#2196F3;
    --brand-white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:24px 18px 80px;}

  header{
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo-slot{
    flex:none;
    width:52px; height:52px;
    border-radius:10px;
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden;
    color:var(--muted);
    font-size:10.5px;
    text-align:center;
    line-height:1.2;
  }
  .logo-slot img{
    width:100%; height:100%;
    object-fit:cover;
  }
  .logo-slot:hover{ color:var(--accent); }
  .eyebrow{font-size:12.5px; color:var(--muted); margin:0 0 4px;}
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:0;
  }

  nav{
    display:flex;
    gap:6px;
    background:var(--line);
    padding:4px;
    border-radius:10px;
    margin-bottom:20px;
  }
  nav button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink);
    border-radius:7px;
    cursor:pointer;
  }
  nav button.active{ background:var(--panel); }

  .panel{
    background:var(--panel);
    box-shadow:0 1px 3px rgba(30,43,34,0.06);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .row-between h2{
    font-family:'Fraunces', serif;
    font-size:17px;
    margin:0;
    font-weight:600;
  }
  #planBanner:empty{ display:none; }
  .acct{ margin-left:auto; position:relative; }
  .acct-btn{ width:42px; height:42px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-weight:700; font-size:16px; cursor:pointer; }
  .acct-menu{ display:none; position:absolute; right:0; top:50px; min-width:210px; max-width:260px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.14); z-index:20; }
  .acct-menu.open{ display:block; }
  .acct-name{ font-weight:700; margin:0; }
  .acct-sub{ margin:2px 0 0; font-size:12.5px; color:var(--muted); word-break:break-all; }
  .acct-out{ width:100%; margin-top:10px; padding:10px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:600; cursor:pointer; }
  .plan-banner{ margin:0 0 14px; padding:12px 14px; border-radius:12px; font-size:13.5px; line-height:1.45; background:var(--panel); border:1px solid var(--line); color:var(--ink); }
  .plan-banner strong{ display:block; font-size:14.5px; margin-bottom:2px; }
  .plan-banner p{ margin:4px 0 0; color:var(--muted); }
  .plan-banner.warn{ background:#FFF7E6; border-color:#F2D48B; }
  .plan-banner.expired{ background:#FDECEC; border-color:#F1B4B4; }
  .plan-btn{ display:inline-block; margin-top:10px; padding:9px 14px; border-radius:999px; background:var(--accent); color:#fff; font-weight:600; font-size:13px; text-decoration:none; }
  .add-btn{
    background:var(--accent);
    color:var(--panel);
    border:none;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .category-select{
    background:var(--paper);
    color:var(--ink);
    border:none;
    border-radius:7px;
    padding:7px 9px;
    font-family:'Work Sans', sans-serif;
    font-size:12.5px;
    cursor:pointer;
  }

  /* Store link block */
  .color-swatches{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
  }
  .color-swatch{
    width:30px; height:30px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .color-swatch.selected{
    border-color:var(--ink);
    box-shadow:0 0 0 2px var(--panel);
  }
  .link-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper);
    border:none;
    border-radius:7px;
    padding:9px 10px;
  }
  .link-row .url{
    flex:1;
    min-width:0;
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .copy-btn{
    flex:none;
    background:var(--accent);
    color:var(--panel);
    border:none;
    font-size:12px;
    font-weight:500;
    padding:6px 11px;
    border-radius:6px;
    cursor:pointer;
  }
  .copy-btn.ghost{
    background:var(--paper);
    color:var(--accent);
    border:none;
  }

  .product{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:none;
  }
  .product:last-child{border-bottom:none;}
  .swatch{
    flex:none;
    width:46px; height:46px;
    border-radius:6px;
    background:var(--accent);
    color:var(--panel);
    font-family:'Fraunces', serif;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .swatch img{ width:100%; height:100%; object-fit:cover; }
  .p-details{flex:1; min-width:0;}
  .p-name{font-size:14.5px; font-weight:500; margin:0 0 2px;}
  .p-meta{font-size:12.5px; color:var(--muted); margin:0;}

  .toggle{
    flex:none;
    width:38px; height:22px;
    border-radius:999px;
    background:var(--line);
    position:relative;
    cursor:pointer;
    border:none;
    padding:0;
  }
  .toggle.on{ background:var(--accent); }
  .toggle .dot{
    position:absolute; top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--panel);
    transition:transform .15s ease;
  }
  .toggle.on .dot{ transform:translateX(16px); }

  .actions{
    flex:none;
    display:flex;
    gap:2px;
  }
  .icon-btn{
    width:30px; height:30px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    padding:0;
    border-radius:8px;
  }
  .icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn:hover{ color:var(--ink); }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    padding:24px 0;
  }

  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin:12px 0 5px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], input[type=tel], input[type=email], textarea, select{
    width:100%;
    border:none;
    outline:none;
    background:var(--paper);
    border-radius:7px;
    padding:9px 11px;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:56px;}
  input[type=color]{
    width:52px; height:38px;
    border:none;
    border-radius:10px;
    padding:3px;
    background:var(--paper);
    cursor:pointer;
    display:block;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:7px;}
  .file-drop{
    background:var(--paper);
    border-radius:7px;
    padding:16px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
  }

  .photo-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:4px;}
  .ph-item{position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:var(--paper);}
  .ph-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .ph-x{position:absolute; top:4px; right:4px; width:24px; height:24px; border:0; border-radius:50%; background:rgba(0,0,0,.62); color:#fff; font-size:15px; line-height:1; cursor:pointer; padding:0;}
  .ph-tag{position:absolute; left:4px; bottom:4px; font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px; background:var(--accent); color:#fff;}
  .ph-main{position:absolute; left:4px; bottom:4px; font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px; background:rgba(0,0,0,.62); color:#fff; border:0; cursor:pointer;}
  .ph-size{position:absolute; right:4px; bottom:4px; font-size:10px; padding:2px 5px; border-radius:5px; background:rgba(0,0,0,.55); color:#fff;}
  .ph-add{aspect-ratio:1/1; border-radius:8px; border:1.5px dashed var(--line); background:var(--paper); color:var(--muted); font-size:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; text-align:center; padding:4px;}
  .ph-add b{font-size:20px; font-weight:400; line-height:1;}
  .ph-note{font-size:11.5px; color:var(--muted); margin:6px 0 0;}
  .form-actions{
    display:flex; gap:8px; margin-top:16px;
  }
  .btn{
    flex:1;
    border:none;
    padding:10px 0;
    border-radius:7px;
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
  }
  .btn.save{ background:var(--accent); color:var(--panel); }
  .btn.cancel{ background:var(--line); color:var(--ink); }

  .toast{
    position:fixed;
    bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  /* Login / signup gate — fixed Veacasy brand colors only (blue + white).
     Deliberately NOT using --accent/--paper/--ink etc: those get overwritten
     by applyTheme() once a vendor logs in, and this screen must never change
     no matter whose theme was last active in this browser tab. */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 18px;
    background:#FFFFFF;
  }
  .login-card{
    width:100%;
    max-width:360px;
    background:#FFFFFF;
    border-radius:16px;
    padding:36px 30px 30px;
    box-shadow:0 4px 24px rgba(33,150,243,0.12);
  }
  .login-logo{
    width:52px; height:52px;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .login-logo img{ width:100%; height:100%; object-fit:contain; }
  .login-card h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    margin:0 0 5px;
    letter-spacing:-0.01em;
    color:#12202E;
  }
  .login-card p{
    font-size:13px;
    color:#5B6B7A;
    margin:0 0 26px;
    line-height:1.4;
  }
  .login-field{ margin-bottom:16px; text-align:left; }
  .login-field label{
    display:block;
    font-size:12px;
    font-weight:500;
    color:#5B6B7A;
    margin-bottom:6px;
  }
  .login-card input{
    width:100%;
    border:1.5px solid #D9E4EC;
    background:#FAFCFE;
    border-radius:9px;
    padding:11px 13px;
    font-family:'Work Sans', sans-serif;
    font-size:14.5px;
    color:#12202E;
    transition:border-color .15s ease;
  }
  .login-card input:focus{
    outline:none;
    border-color:#2196F3;
  }
  .login-btn{
    width:100%;
    background:#2196F3;
    color:#FFFFFF;
    border:none;
    padding:12px 0;
    border-radius:9px;
    font-family:'Work Sans', sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
    letter-spacing:0.01em;
  }
  .login-btn:active{ opacity:0.9; }
  .login-switch{
    text-align:center;
    font-size:13px;
    color:#5B6B7A;
    margin-top:18px;
  }
  .login-switch button{
    background:none;
    border:none;
    color:#2196F3;
    font-weight:600;
    cursor:pointer;
    font-size:13px;
    padding:0;
  }
  .login-error{
    color:#a83232;
    background:rgba(168,50,50,0.08);
    border-radius:7px;
    font-size:12.5px;
    padding:9px 11px;
    margin:0 0 16px;
    display:none;
  }
  .login-error.show{ display:block; }
  .logout-link{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
  }

  /* Clean VEACASY UI pass — remove generic hairline borders from forms and product rows. */
  .copy-btn.ghost{border:none;}
  .product{border-bottom:none;}
  input[type=text], input[type=number], input[type=tel], textarea, select{border:none; outline:none;}
  input[type=text]:focus, input[type=number]:focus, input[type=tel]:focus, textarea:focus, select:focus{box-shadow:0 0 0 2px rgba(33,150,243,.14);}
  input[type=color]{border:none;}

  /* Welcome-page-inspired login / account creation screen. */
  .login-wrap{
    position:relative;
    align-items:center;
    padding:76px 18px 32px;
    background:#F6F9FC;
  }
  .home-link{
    position:absolute;
    top:24px; left:24px;
    color:#1976D2;
    text-decoration:none;
    font-family:'DM Sans','Work Sans',sans-serif;
    font-size:13px;
    font-weight:600;
  }
  .home-link:hover{opacity:.78;}
  .home-link{display:inline-flex;align-items:center;gap:7px;}
  .back-icon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .login-card{
    max-width:390px;
    background:#FFFFFF;
    border-radius:24px;
    padding:34px 30px 30px;
    box-shadow:0 18px 50px rgba(18,32,46,.08);
  }
  .login-logo{width:50px;height:50px;border-radius:13px;margin-bottom:22px;}
  .login-card h1{
    font-family:'DM Sans','Work Sans',sans-serif;
    font-size:28px;
    font-weight:700;
    letter-spacing:-.04em;
    color:#12202E;
    margin-bottom:7px;
  }
  .login-card p{font-family:'DM Sans','Work Sans',sans-serif;color:#5B6B7A;}
  .login-field label{font-family:'DM Sans','Work Sans',sans-serif;color:#5B6B7A;}
  .login-card input{
    border:none;
    background:#F6F9FC;
    border-radius:12px;
    padding:12px 13px;
    font-family:'DM Sans','Work Sans',sans-serif;
  }
  .login-card input:focus{outline:none;border:none;box-shadow:0 0 0 2px rgba(33,150,243,.16);}
  .login-btn{
    border-radius:12px;
    font-family:'DM Sans','Work Sans',sans-serif;
    padding:13px 0;
  }
  .login-switch{font-family:'DM Sans','Work Sans',sans-serif;}
  @media(max-width:520px){
    .home-link{left:18px;top:18px;}
    .login-wrap{padding-top:66px;}
    .login-card{padding:30px 22px 24px;border-radius:20px;}
  }
.pagination-wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px}.pagination-summary{font-size:12px;color:var(--muted)}.pagination{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}.page-btn{min-width:32px;height:32px;padding:0 9px;border:0;background:transparent;color:var(--muted);border-radius:8px;font:500 12px inherit;cursor:pointer}.page-btn:hover:not(:disabled){background:rgba(0,0,0,.04)}.page-btn.active{background:var(--accent);color:#fff}.page-btn.nav{padding:0 10px}.page-btn:disabled{opacity:.35;cursor:default}.page-gap{font-size:12px;color:var(--muted);padding:0 2px}@media(max-width:620px){.pagination-wrap{align-items:flex-start;flex-direction:column}.pagination{width:100%;justify-content:flex-start}.page-btn.nav{order:-1}}</style>
</head>
<body>

<div class="login-wrap" id="loginGate">
  <a class="home-link" href="/" aria-label="Back to VEACASY welcome page"><svg class="back-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg> Back to VEACASY</a>
  <div class="login-card">
    <div class="login-logo"><img src="/veacasy-logo.jpeg" alt="VEACASY"></div>

    <div id="loginForm">
      <h1>Welcome back</h1>
      <p>Log in to manage your store</p>
      <p class="login-error" id="login-error"></p>
      <div class="login-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="login-btn" id="login-btn">Log in</button>
      <p class="login-switch">New to Veacasy? <button id="showSignup">Create your store</button></p>
    </div>

    <div id="signupForm" style="display:none;">
      <h1>Create your store</h1>
      <p>Set up your Veacasy catalog in a couple minutes</p>
      <p class="login-error" id="signup-error"></p>
      <div class="login-field">
        <label for="signup-name">Business name</label>
        <input type="text" id="signup-name" placeholder="e.g. Sparkles by Annie">
      </div>
      <div class="login-field">
        <label for="signup-slug">Your store link</label>
        <input type="text" id="signup-slug" placeholder="auto-fills from business name">
      </div>
      <div class="login-field">
        <label for="signup-whatsapp">WhatsApp number</label>
        <input type="tel" id="signup-whatsapp" placeholder="2348012345678">
      </div>
      <div class="login-field">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com">
      </div>
      <div class="login-field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="At least 6 characters">
      </div>
      <p style="font-size:12.5px;color:#5f6b7a;margin:2px 0 12px;">Free 14-day trial with up to 20 products. No code needed.</p>
      <button class="login-btn" id="signup-btn">Create store</button>
      <p class="login-switch">Already have a store? <button id="showLogin">Log in</button></p>
    </div>
  </div>
</div>

<div id="dashboardContent" style="display:none;">
<div class="wrap">
  <header>
    <div class="logo-slot" id="logoSlot">+ Logo</div>
    <div>
      <p class="eyebrow">Your store</p>
      <h1>Dashboard</h1>
    </div>
    <input type="file" id="logoInput" accept="image/*" style="display:none;">
    <div class="acct" id="acct"><button class="acct-btn" id="acctBtn" aria-label="Account menu">A</button><div class="acct-menu" id="acctMenu"><p class="acct-name" id="acctName"></p><p class="acct-sub" id="acctEmail"></p><p class="acct-sub" id="acctPlan"></p><button class="acct-out" id="logoutBtn">Sign out</button></div></div>
  </header>

  <div id="planBanner"></div>

  <nav>
    <button class="active" data-tab="products">Products</button>
    <button data-tab="settings">Store Settings</button>
  </nav>

  <div id="productsTab"></div>
  <div id="settingsTab" style="display:none;"></div>

</div>
</div>

<div class="toast" id="toast">Saved</div>


<script>
  // ─── SUPABASE CONNECTION ──────────────────────────────────────
  // Paste your own project's values here — Supabase dashboard →
  // Settings → API. Safe to leave visible in this file: RLS is what
  // actually protects the data, not hiding this key.
  const SUPABASE_URL = "https://bfirghwabailetfuepyh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKf6tIadS8Fq-wzSTl95hw_UcrELF5p";
  let supabaseClient = null;

  function getSupabase(){
    if (supabaseClient) return supabaseClient;
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      throw new Error("Veacasy could not load its backend connection. Please refresh the page. If this keeps happening, the Supabase library is being blocked from loading.");
    }
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        storage: window.sessionStorage,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });
    return supabaseClient;
  }

  const DOMAIN = "veacasy.vercel.app"; // update to veacasy.com once that domain is live

      .from("vendors")
      .select("*")
      .eq("id", currentVendorId)
      .single();

    }

      contactEmail: vendor.contact_email || "",

      logoUrl: vendor.logo_url,
      plan: vendor.plan || "basic",

      trialEndsAt: vendor.trial_ends_at || null,
      expiresAt: vendor.expires_at || null,
      productLimit: vendor.product_limit || 0,

      .from("products")
      .select("id", { count: "exact", head: true })
      .eq("vendor_id", currentVendorId);

    const { data: categoryRows, error: categoryError } = await getSupabase()
      .from("products")
      .select("category")
      .eq("vendor_id", currentVendorId)
      .limit(1000);
    if (categoryError) throw categoryError;
    dashboardCategories = [...new Set((categoryRows || []).map(r => (r.category || "").trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b));

    // Load only the current dashboard page. This keeps the dashboard fast even
    // when a vendor has more than Supabase's default 1,000-row response size.
    await loadDashboardProducts();

  // ─── PLAN STATUS (trial / expiry) ───────────────────────────────
  const VEACASY_WHATSAPP = "2347026438309";

  function planIsActive(){
    if (settings.status && settings.status !== "active") return false;
    const now = Date.now();
    if (settings.plan === "trial" && settings.trialEndsAt && new Date(settings.trialEndsAt).getTime() <= now) return false;
    if (settings.expiresAt && new Date(settings.expiresAt).getTime() <= now) return false;
    return true;
  }

  function planEndDate(){
    if (settings.plan === "trial") return settings.trialEndsAt ? new Date(settings.trialEndsAt) : null;
    return settings.expiresAt ? new Date(settings.expiresAt) : null;
  }

    const text = `Hi VEACASY, I'd like to upgrade my store (${DOMAIN}/${settings.slug}/). Please send me the plans and payment details.`;

  async function loadDashboardProducts(){
    const from = (dashboardPage - 1) * dashboardPageSize;
    const to = from + dashboardPageSize - 1;
    const baseCols = "id,code,name,price,category,in_stock,description,photo_url";
    const runQuery = (cols) => {
      let query = getSupabase()
        .from("products")
        .select(cols, { count: "exact" })
        .eq("vendor_id", currentVendorId);
      if (categoryFilter !== "All") query = query.eq("category", categoryFilter);
      return query.order("id", { ascending: false }).range(from, to);
    };

    let res = await runQuery(baseCols + (photoUrlsSupported ? ",photo_urls" : ""));
    // If the photo_urls column hasn't been added in Supabase yet, keep the dashboard working.
    if (res.error && photoUrlsSupported && /photo_urls/i.test(res.error.message || "")){
      photoUrlsSupported = false;
      res = await runQuery(baseCols);
    }
    const { data: rows, error, count } = res;

    if (error) throw error;

    products = (rows || []).map(p => ({
      id: p.id,

      description: p.description || "",
      photoUrl: p.photo_url,
      photoUrls: (Array.isArray(p.photo_urls) && p.photo_urls.length) ? p.photo_urls.filter(Boolean) : (p.photo_url ? [p.photo_url] : []),
    }));
    dashboardTotal = Number(count || 0);

  // Uploads a picked File/Blob to Storage and returns its public URL.
  // Used for both product photos and the store logo.
  async function uploadPhoto(file, folder){
    const type = file.type || "image/jpeg";
    const ext = type === "image/webp" ? "webp" : type === "image/png" ? "png" : type === "image/gif" ? "gif" : "jpg";
    const rand = Math.random().toString(36).slice(2, 8);
    const path = `${folder}/${currentVendorId}/${Date.now()}-${rand}.${ext}`;
    const { error } = await getSupabase().storage.from("product-photos").upload(path, file, { contentType: type, cacheControl: "31536000" });
    if (error) throw error;
    const { data } = getSupabase().storage.from("product-photos").getPublicUrl(path);
    return data.publicUrl;
  }

  // ─── IMAGE COMPRESSION ────────────────────────────────────────
  // Runs in the browser before upload. Images at or under the target are kept
  // as-is; larger ones are resized and re-encoded (WebP where supported,
  // JPEG otherwise) until they are near the target. 300 KB is a target, not a guarantee.
  const MAX_PRODUCT_PHOTOS = 5;
  const IMAGE_TARGET_BYTES = 300 * 1024;
  let photoUrlsSupported = true; // flips to false if the photo_urls column doesn't exist yet

  function fmtSize(b){ return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }

  function loadBitmap(file){
    if (window.createImageBitmap){
      return createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => loadViaImg(file));
    }
    return loadViaImg(file);
  }
  function loadViaImg(file){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't read that image")); };
      img.src = url;
    });
  }
  function canvasBlob(canvas, type, quality){
    return new Promise(resolve => canvas.toBlob(b => resolve(b), type, quality));
  }

  async function compressImage(file){
    if (file.size <= IMAGE_TARGET_BYTES && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;

    const bitmap = await loadBitmap(file);
    const srcW = bitmap.width, srcH = bitmap.height;
    let scale = Math.min(1, 1600 / Math.max(srcW, srcH));
    let best = null;

    for (let round = 0; round < 6; round++){
      const w = Math.max(1, Math.round(srcW * scale)), h = Math.max(1, Math.round(srcH * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(bitmap, 0, 0, w, h);

      for (const q of [0.82, 0.72, 0.62, 0.52]){
        let blob = await canvasBlob(canvas, "image/webp", q);
        if (!blob || blob.type !== "image/webp") blob = await canvasBlob(canvas, "image/jpeg", q); // WebP unsupported
        if (!blob) continue;
        if (!best || blob.size < best.size) best = blob;
        if (blob.size <= IMAGE_TARGET_BYTES) { if (bitmap.close) bitmap.close(); return blob; }
      }
      if (Math.max(w, h) <= 640) break;
      scale *= 0.8; // still too big at lowest quality: shrink and try again
    }
    if (bitmap.close) bitmap.close();
    // Use whichever is smaller: our best attempt or the original.
    return (best && best.size < file.size) ? best : file;
  }

  let dashboardPage = 1;
  const dashboardPageSize = 20;
  let dashboardTotal = 0;

  let editingId = null; // null = list view, "new" = add form, number = editing that product
  let categoryFilter = "All"; // dashboard-side category filter
  // Photos in the product form, in display order. The first one is the main image.
  // Each item: { url: preview or existing public URL, blob: compressed file to upload (null if already stored), size }
  let formImages = [];
  let formBusy = 0; // number of images still compressing

  function photoGridInner(){
    const tiles = formImages.map((im, i) => `
      <div class="ph-item">

        ${im.size ? `<span class="ph-size">${fmtSize(im.size)}</span>` : ""}
      </div>`).join("");
    const slotsLeft = MAX_PRODUCT_PHOTOS - formImages.length - formBusy;

    const addTile = slotsLeft > 0
      ? `<div class="ph-add" id="productPhotoAdd"><b>+</b>${formImages.length ? "Add photo" : "Add photos"}</div>` : "";

  function showToast(msg){
    const t = document.getElementById("toast");

    setTimeout(() => t.classList.remove("show"), 1400);
  }

  function money(n){ return "₦" + Number(n).toLocaleString(); }
  function initials(name){ return name.trim().charAt(0); }

  function hexToHsl(hex){
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
    const r = parseInt(hex.substr(0,2),16)/255, g = parseInt(hex.substr(2,2),16)/255, b = parseInt(hex.substr(4,2),16)/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h, s, l = (max+min)/2;
    if (max === min){ h = s = 0; }
    else{
      const d = max - min;
      s = l > 0.5 ? d/(2-max-min) : d/(max+min);
      switch(max){
        case r: h = (g-b)/d + (g<b?6:0); break;
        case g: h = (b-r)/d + 2; break;
        default: h = (r-g)/d + 4;
      }
      h /= 6;
    }
    return { h: h*360, s: s*100, l: l*100 };
  }

  function hslToHex(h, s, l){
    s/=100; l/=100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const toHex = x => Math.round(255*x).toString(16).padStart(2,"0");
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
  }

  // Picking one accent color re-tints the whole page — background, panels,
  // borders and text all shift to the same hue, just at very different
  // lightness levels so contrast stays readable no matter what's picked.
  function applyTheme(accentHex){
    const { h, s, l } = hexToHsl(accentHex);
    const isNeutral = s < 4; // true black / white / gray — hue is meaningless here, don't fake a tint
    const maxAccentLightness = 55; // caps how pale the accent can be, so light button text stays readable
    const safeL = Math.min(l, maxAccentLightness); // black (l=0) passes straight through untouched
    const safeAccentHex = hslToHex(h, s, safeL);
    const bgS = tone => isNeutral ? 0 : tone; // neutral picks get a true gray theme, not a false tint

    const root = document.documentElement.style;
    root.setProperty("--accent", safeAccentHex);
    root.setProperty("--paper", hslToHex(h, bgS(22), 93));
    root.setProperty("--panel", hslToHex(h, bgS(20), 98));
    root.setProperty("--line", hslToHex(h, bgS(22), 82));
    root.setProperty("--muted", hslToHex(h, bgS(14), 42));
    root.setProperty("--ink", hslToHex(h, bgS(22), 14));
    return safeAccentHex;
  }
  function slugify(str){
    return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }
  function storeUrl(){ return `${DOMAIN}/${settings.slug}/`; }
  function productUrl(p){ return `${DOMAIN}/${settings.slug}/${encodeURIComponent(p.code)}/`; }

  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText("https://" + text).catch(() => {});
    }
    showToast("Link copied");
  }

  function renderProductsTab(){
    const el = document.getElementById("productsTab");

    if (editingId !== null){
      const isNew = editingId === "new";
      const p = isNew
        ? { name:"", price:"", category:"", description:"" }
        : products.find(x => x.id === editingId);
      formImages = (p.photoUrls || []).map(u => ({ url: u, blob: null, size: null }));
      formBusy = 0;

      el.innerHTML = `
        <div class="panel">
          <div class="row-between"><h2>${isNew ? "Add product" : "Edit product"}</h2></div>
          <label>Product photos <span style="color:var(--muted); font-weight:400;">(up to ${MAX_PRODUCT_PHOTOS})</span></label>

          <textarea id="f-desc" maxlength="500">${p.description || ""}</textarea>
          <div id="descCounter" style="font-size:11.5px;color:var(--muted);text-align:right;margin-top:4px;">${(p.description || "").length} / 500</div>
          ${!isNew ? `
          <label>Product link</label>
          <div class="link-row">
            <span class="url">${productUrl(p)}</span>
            <button class="copy-btn" id="copyProductLink">Copy</button>
          </div>` : ""}
          <div class="form-actions">
            <button class="btn cancel" id="cancelBtn">Cancel</button>
            <button class="btn save" id="saveBtn">Save</button>
          </div>
        </div>`;

      const descInput = document.getElementById("f-desc");
      const descCounter = document.getElementById("descCounter");

      const refreshPhotoGrid = () => {
        document.getElementById("productPhotoGrid").innerHTML = photoGridInner();

      };
      document.getElementById("productPhotoGrid").onclick = (e) => {

      };
      refreshPhotoGrid();

      document.getElementById("productPhotoInput").onchange = async (e) => {
        const files = Array.from(e.target.files || []).filter(f => /^image\//.test(f.type));
        e.target.value = "";
        if (!files.length) return;
        const room = MAX_PRODUCT_PHOTOS - formImages.length - formBusy;
        if (files.length > room) showToast(room > 0 ? `Only ${room} more photo${room === 1 ? "" : "s"} allowed — extra ones skipped` : `Maximum ${MAX_PRODUCT_PHOTOS} photos`);
        const chosen = files.slice(0, Math.max(0, room));
        if (!chosen.length) return;
        formBusy += chosen.length;
        refreshPhotoGrid();
        const saveBtnEl = document.getElementById("saveBtn");
        if (saveBtnEl) saveBtnEl.disabled = true;
        for (const f of chosen){
          try {
            const blob = await compressImage(f);
            if (!document.getElementById("productPhotoGrid")) return; // form was closed meanwhile
            formImages.push({ url: URL.createObjectURL(blob), blob, size: blob.size });
          } catch (err) {
            showToast("Skipped a photo — " + (err.message || "couldn't process it"));
          }
          formBusy--;
          if (document.getElementById("productPhotoGrid")) refreshPhotoGrid();
        }
        const sb = document.getElementById("saveBtn");
        if (sb && formBusy === 0) sb.disabled = false;
      };

      document.getElementById("f-desc").addEventListener("input", (e) => {
        const counter = document.getElementById("descCounter");
        if (counter) counter.textContent = `${e.target.value.length} / 500`;
      });

      document.getElementById("cancelBtn").onclick = () => { editingId = null; renderProductsTab(); };
      document.getElementById("saveBtn").onclick = async () => {
        const name = document.getElementById("f-name").value.trim();
        const price = Number(document.getElementById("f-price").value) || 0;
        const category = document.getElementById("f-category").value.trim();
        const description = document.getElementById("f-desc").value.trim();
        if (!name){ return; }

        const saveBtn = document.getElementById("saveBtn");
        saveBtn.textContent = "Saving...";
        saveBtn.disabled = true;

        try {
          // Upload any new (already compressed) photos; keep existing ones as they are.
          const urls = [];
          for (const im of formImages){
            urls.push(im.blob ? await uploadPhoto(im.blob, "products") : im.url);
          }
          const photoUrl = urls[0] || null; // photo_url always mirrors the main image (keeps old pages working)
          const photoFields = { photo_url: photoUrl };
          if (photoUrlsSupported) photoFields.photo_urls = urls;

          if (isNew){
            const { error } = await getSupabase().from("products").insert({
              vendor_id: currentVendorId, name, price, category, description,
              in_stock: true, ...photoFields,
            });
            if (error) throw error;
          } else {
            const { error } = await getSupabase().from("products")
              .update({ name, price, category, description, ...photoFields })
              .eq("id", p.id);
            if (error) throw error;
          }

          await loadVendorData();
          editingId = null;
          renderProductsTab();
          showToast("Saved");
        } catch (err) {
          showToast(/photo_urls/i.test(err.message || "") ? "Couldn't save — run the VEACASY database update (SQL) first" : "Couldn't save — " + err.message);
          saveBtn.textContent = "Save";
          saveBtn.disabled = false;
        }
      };
      if (!isNew){
        document.getElementById("copyProductLink").onclick = () => copyToClipboard(productUrl(p));
      }
      return;
    }

    const pageCount = Math.max(1, Math.ceil(dashboardTotal / dashboardPageSize));
    const pageItems = [];
    const pushPage = (n) => pageItems.push(`<button class="page-btn ${n === dashboardPage ? "active" : ""}" data-page="${n}">${n}</button>`);
    if (pageCount <= 7){
      for (let n = 1; n <= pageCount; n++) pushPage(n);
    } else {
      pushPage(1);
      if (dashboardPage > 4) pageItems.push(`<span class="page-gap">…</span>`);
      const startPage = Math.max(2, dashboardPage - 1);
      const endPage = Math.min(pageCount - 1, dashboardPage + 1);
      for (let n = startPage; n <= endPage; n++) pushPage(n);
      if (dashboardPage < pageCount - 3) pageItems.push(`<span class="page-gap">…</span>`);
      pushPage(pageCount);
    }
    const firstShown = dashboardTotal ? ((dashboardPage - 1) * dashboardPageSize) + 1 : 0;
    const lastShown = Math.min(dashboardPage * dashboardPageSize, dashboardTotal);
    const visibleProducts = products;

    el.innerHTML = `
      <div class="panel">
        <div class="row-between"><h2>Store link</h2></div>
        <div class="link-row">
          <span class="url">${storeUrl()}</span>
          <button class="copy-btn" id="copyStoreLink">Copy</button>
        </div>
      </div>
      <div class="panel">
        <div class="row-between">
          <h2>Products</h2>
          <div class="header-actions">
            <select class="category-select" id="categoryFilterSelect">
              ${["All", ...dashboardCategories].map(c =>
                `<option value="${c}" ${c === categoryFilter ? "selected" : ""}>${c === "All" ? "All categories" : c}</option>`
              ).join("")}
            </select>
            <button class="add-btn" id="addBtn">+ Add product</button>
          </div>
        </div>
        <div id="productList">
          ${visibleProducts.length ? visibleProducts.map(p => `
            <div class="product">
              <div class="swatch">${p.photoUrl ? `<img src="${p.photoUrl}" alt="${p.name}">` : initials(p.name)}</div>
              <div class="p-details">
                <p class="p-name">${p.name}</p>
                <p class="p-meta">${money(p.price)} · ${p.category || "Uncategorized"}</p>
              </div>
              <button class="toggle ${p.inStock ? "on" : ""}" data-id="${p.id}" title="In stock"><span class="dot"></span></button>
              <div class="actions">
                <button class="icon-btn" data-link="${p.id}" title="Copy product link" aria-label="Copy product link"><svg viewBox="0 0 24 24"><path d="M10 13.5 14 9.5"/><path d="M7.5 16.5 6 18a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0"/><path d="m16.5 7.5 1.5-1.5a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0"/></svg></button>
                <button class="icon-btn" data-edit="${p.id}" title="Edit" aria-label="Edit product"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button>
                <button class="icon-btn" data-delete="${p.id}" title="Delete" aria-label="Delete product"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="m7 7 1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg></button>
              </div>
            </div>
          `).join("") : `<div class="empty">${dashboardTotal ? "No products on this page." : (categoryFilter === "All" ? "No products yet — add your first one." : `No products in "${categoryFilter}" yet.`)}</div>`}
        </div>
        ${dashboardTotal ? `<div class="pagination-wrap">
          <span class="pagination-summary">Showing ${firstShown}–${lastShown} of ${dashboardTotal}</span>
          <div class="pagination">
            <button class="page-btn nav" data-page="${dashboardPage - 1}" ${dashboardPage <= 1 ? "disabled" : ""}>‹ Previous</button>
            ${pageItems.join("")}
            <button class="page-btn nav" data-page="${dashboardPage + 1}" ${dashboardPage >= pageCount ? "disabled" : ""}>Next ›</button>
          </div>
        </div>` : ""}
      </div>`;

    document.getElementById("copyStoreLink").onclick = () => copyToClipboard(storeUrl());
    document.getElementById("categoryFilterSelect").onchange = async (e) => {
      categoryFilter = e.target.value;
      dashboardPage = 1;
      try { await loadDashboardProducts(); renderProductsTab(); } catch (err) { showToast("Couldn't load products — try again"); }
    };
    el.querySelectorAll("[data-page]").forEach(btn => {
      btn.onclick = async () => {
        const nextPage = Number(btn.dataset.page);
        if (!nextPage || nextPage < 1 || nextPage > pageCount || nextPage === dashboardPage) return;
        dashboardPage = nextPage;
        try { await loadDashboardProducts(); renderProductsTab(); } catch (err) { showToast("Couldn't load products — try again"); }
      };
    });
    document.getElementById("addBtn").onclick = () => {
      if (!planIsActive()){ showToast("Your plan has ended. Upgrade to add products."); return; }
      if (settings.productLimit && settings.productCount >= settings.productLimit){ showToast(`Product limit reached (${settings.productLimit}). Upgrade to add more.`); return; }
      editingId = "new"; renderProductsTab();
    };
    el.querySelectorAll(".toggle").forEach(btn => {
      btn.onclick = async () => {
        const p = products.find(x => x.id === btn.dataset.id);
        const newValue = !p.inStock;
        p.inStock = newValue; // optimistic — update the screen immediately
        renderProductsTab();
        const { error } = await getSupabase().from("products").update({ in_stock: newValue }).eq("id", p.id);
        if (error){
          p.inStock = !newValue; // roll back if the save actually failed
          renderProductsTab();
          showToast("Couldn't update — try again");
        } else {
          showToast(newValue ? "Marked in stock" : "Marked sold out");
        }
      };
    });
    el.querySelectorAll("[data-link]").forEach(btn => {
      btn.onclick = () => {
        const p = products.find(x => x.id === btn.dataset.link);
        copyToClipboard(productUrl(p));
      };
    });
    el.querySelectorAll("[data-edit]").forEach(btn => {
      btn.onclick = () => { editingId = btn.dataset.edit; renderProductsTab(); };
    });
    el.querySelectorAll("[data-delete]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.delete;
        const { error } = await getSupabase().from("products").delete().eq("id", id);
        if (error){ showToast("Couldn't delete — try again"); return; }
        settings.productCount = Math.max(0, (settings.productCount || 0) - 1);
        renderPlanBanner();
        if (products.length === 1 && dashboardPage > 1) dashboardPage -= 1;
        try { await loadDashboardProducts(); renderProductsTab(); } catch (err) { showToast("Couldn't reload products — try again"); return; }
        showToast("Deleted");
      };
    });
  }

  function renderSettingsTab(){
    const el = document.getElementById("settingsTab");
    const swatches = ["#D4A72C","#DC2626","#EA580C","#16A34A","#0D9488","#2563EB","#7C3AED","#DB2777","#1E293B","#000000"];
    el.innerHTML = `
      <div class="panel">
        <h2 style="font-family:'Fraunces', serif; font-size:19px; margin:0 0 4px;">Store Settings</h2>
        <p style="font-size:13px; color:var(--muted); margin:0;">Customize your store's appearance and contact information</p>
      </div>

      <div class="panel">
        <div class="row-between"><h2>Appearance</h2></div>
        <label>Business name</label>
        <input type="text" id="s-name" value="${settings.businessName}">
        <label>Tagline</label>
        <input type="text" id="s-tagline" value="${settings.tagline}">
        <label>Logo</label>
        <div class="file-drop" id="settingsLogoDrop" style="cursor:pointer;">
          ${settings.logoUrl
            ? `<img src="${settings.logoUrl}" alt="Logo" style="width:40px;height:40px;border-radius:8px;object-fit:cover;">`
            : "Tap to upload a logo"}
        </div>
        <label>Store color</label>
        <div class="color-swatches" id="colorSwatches">
          ${swatches.map(c => `<button type="button" class="color-swatch ${c.toLowerCase() === settings.accent.toLowerCase() ? "selected" : ""}" data-color="${c}" style="background:${c};"></button>`).join("")}
        </div>
        <input type="color" id="s-accent" value="${settings.accent}" style="margin-top:8px;">
        <p style="font-size:12px; color:var(--muted); margin:6px 0 0;">This color is used for buttons and accents on your storefront.</p>
      </div>

      <div class="panel">
        <div class="row-between"><h2>Contact Information</h2></div>
        <label>Email address</label>
        <input type="email" id="s-email" value="${settings.contactEmail}" placeholder="you@example.com">
        <label>Phone number</label>
        <input type="tel" id="s-phone" value="${settings.phone}" placeholder="0801 234 5678">
        <label>WhatsApp number <span style="color:#a83232;">*</span></label>
        <input type="tel" id="s-whatsapp" value="${settings.whatsapp}">
        <p style="font-size:12px; color:var(--muted); margin:-2px 0 14px;">Required — this is where order messages are sent.</p>
        <label>Store address</label>
        <input type="text" id="s-address" value="${settings.address}" placeholder="Your store's physical location, if any">
      </div>

      <div class="panel">
        <div class="row-between"><h2>Store link</h2></div>
        <div class="link-row">
          <span class="url">${storeUrl()}</span>
          <button class="copy-btn ghost" id="copyStoreLinkSettings">Copy</button>
        </div>
        <div class="form-actions">
          <button class="btn save" id="settingsSaveBtn" style="flex:none; padding:10px 22px;">Save all changes</button>
        </div>
      </div>`;

    document.getElementById("copyStoreLinkSettings").onclick = () => copyToClipboard(storeUrl());
    document.getElementById("settingsLogoDrop").onclick = () => document.getElementById("logoInput").click();
    document.querySelectorAll(".color-swatch").forEach(sw => {
      sw.onclick = () => {
        document.getElementById("s-accent").value = sw.dataset.color;
        document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
        sw.classList.add("selected");
      };
    });
    document.getElementById("settingsSaveBtn").onclick = async () => {
      const btn = document.getElementById("settingsSaveBtn");
      const newName = document.getElementById("s-name").value.trim();
      const newTagline = document.getElementById("s-tagline").value.trim();
      const newWhatsapp = document.getElementById("s-whatsapp").value.trim();
      const newEmail = document.getElementById("s-email").value.trim();
      const newPhone = document.getElementById("s-phone").value.trim();
      const newAddress = document.getElementById("s-address").value.trim();
      const pickedColor = document.getElementById("s-accent").value;
      const safeAccent = applyTheme(pickedColor); // may be a slightly darker version of what was picked

      btn.textContent = "Saving...";
      btn.disabled = true;

      try {
        let logoUrl = settings.logoUrl;
        if (formLogoFile){
          logoUrl = await uploadPhoto(formLogoFile, "logos");
        }

        const { error } = await getSupabase().from("vendors").update({
          business_name: newName,
          tagline: newTagline,
          whatsapp_number: newWhatsapp,
          contact_email: newEmail,
          phone_number: newPhone,
          address: newAddress,
          accent_color: safeAccent,
          logo_url: logoUrl,
        }).eq("id", currentVendorId);

        if (error) throw error;

        settings.businessName = newName;
        settings.tagline = newTagline;
        settings.whatsapp = newWhatsapp;
        settings.contactEmail = newEmail;
        settings.phone = newPhone;
        settings.address = newAddress;
        settings.accent = safeAccent;
        settings.logoUrl = logoUrl;
        formLogoFile = null;
        document.querySelector(".eyebrow").textContent = settings.businessName;

        showToast(pickedColor.toLowerCase() === safeAccent.toLowerCase()
          ? "Store settings saved"
          : "Saved — color darkened slightly to keep button text readable");
      } catch (err) {
        // The database itself blocks a 4th name change (see the SQL trigger) —
        // this surfaces that as a normal message instead of a raw error.
        showToast(err.message.includes("can only be changed 3 times")
          ? "Store name change limit reached — can't be changed again"
          : "Couldn't save — " + err.message);
      } finally {
        btn.textContent = "Save all changes";
        btn.disabled = false;
      }
    };
  }

  document.querySelectorAll("nav button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.dataset.tab;
      document.getElementById("productsTab").style.display = tab === "products" ? "block" : "none";
      document.getElementById("settingsTab").style.display = tab === "settings" ? "block" : "none";
    };
  });

  function renderLogo(){
    const slot = document.getElementById("logoSlot");
    slot.innerHTML = settings.logoUrl ? `<img src="${settings.logoUrl}" alt="Logo">` : "+ Logo";
  }

  document.getElementById("logoSlot").onclick = () => document.getElementById("logoInput").click();
  let formLogoFile = null;
  document.getElementById("logoInput").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    formLogoFile = file;
    const reader = new FileReader();
    reader.onload = () => {
      settings.logoUrl = reader.result; // local preview only, until Settings Save actually uploads it
      renderLogo();
      if (document.getElementById("settingsTab").style.display !== "none") renderSettingsTab();
      showToast("Logo ready — hit Save in Store Settings to keep it");
    };
    reader.readAsDataURL(file);
  };

  // ─── LOGIN ─────────────────────────────────────────────────────

  function renderAccountMenu(email){
    const name = settings.businessName || "Your store";
    document.getElementById("acctBtn").textContent = name.trim().charAt(0).toUpperCase() || "A";
    document.getElementById("acctName").textContent = name;
    document.getElementById("acctEmail").textContent = email || "";
    const labels = { trial:"Free trial", basic:"Basic plan", ceo:"CEO plan", custom:"Custom plan" };
    document.getElementById("acctPlan").textContent = labels[settings.plan] || "";
    const menu = document.getElementById("acctMenu");
    if (!menu.dataset.bound){
      menu.dataset.bound = "1";
      document.getElementById("acctBtn").onclick = (e) => { e.stopPropagation(); menu.classList.toggle("open"); };
      document.addEventListener("click", (e) => { if (!document.getElementById("acct").contains(e.target)) menu.classList.remove("open"); });
    }
  }

  async function checkLogin(){
    const { data: { session } } = await getSupabase().auth.getSession();

    if (!session){
      document.getElementById("loginGate").style.display = "block";
      document.getElementById("dashboardContent").style.display = "none";
      return;
    }

    currentVendorId = session.user.id;
    resetInactivityTimer();

    try {
      await loadVendorData();
    } catch (err) {
      document.getElementById("login-error").textContent = err.message;
      document.getElementById("login-error").classList.add("show");
      document.getElementById("loginGate").style.display = "block";
      document.getElementById("dashboardContent").style.display = "none";
      await getSupabase().auth.signOut(); // don't leave them "logged in" with no store to manage
      return;
    }

    document.getElementById("loginGate").style.display = "none";
    document.getElementById("dashboardContent").style.display = "block";
    document.querySelector(".eyebrow").textContent = settings.businessName || "Your store";
    renderAccountMenu(session.user.email);
    renderProductsTab();
    renderSettingsTab();
    renderLogo();
    applyTheme(settings.accent);
  }

  // ─── TAB SESSION + 30-MINUTE INACTIVITY TIMEOUT ───────────────
  // Auth stays in this browser tab only. Any meaningful user activity
  // resets the inactivity clock; after 30 minutes without activity the
  // current session is signed out and the login screen is shown again.
  const INACTIVITY_LIMIT_MS = 30 * 60 * 1000;
  let inactivityTimer = null;
  let lastActivityAt = Date.now();
  let activityScheduled = false;

  function resetInactivityTimer(){
    lastActivityAt = Date.now();
    if (inactivityTimer) clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(enforceInactivityTimeout, INACTIVITY_LIMIT_MS);
  }

  async function enforceInactivityTimeout(){
    const elapsed = Date.now() - lastActivityAt;
    if (elapsed < INACTIVITY_LIMIT_MS){
      resetInactivityTimer();
      return;
    }

    const { data: { session } } = await getSupabase().auth.getSession();
    if (!session) return;

    await getSupabase().auth.signOut({ scope: "local" });
    currentVendorId = null;
    document.getElementById("login-email").value = "";
    document.getElementById("login-password").value = "";
    showLoginForm();
    document.getElementById("login-error").textContent = "You were logged out after 30 minutes of inactivity.";
    document.getElementById("login-error").classList.add("show");
    document.getElementById("loginGate").style.display = "block";
    document.getElementById("dashboardContent").style.display = "none";
  }

  function noteActivity(){
    if (activityScheduled) return;
    activityScheduled = true;
    requestAnimationFrame(() => {
      activityScheduled = false;
      if (document.getElementById("dashboardContent").style.display !== "none") resetInactivityTimer();
    });
  }

  ["pointerdown", "keydown", "scroll", "touchstart"].forEach(eventName => {
    window.addEventListener(eventName, noteActivity, { passive: true });
  });

  // ─── LOGIN / SIGNUP TOGGLE ─────────────────────────────────────

  function showLoginForm(){
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("signupForm").style.display = "none";
  }
  function showSignupForm(){
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "block";
  }
  document.getElementById("showSignup").onclick = showSignupForm;
  document.getElementById("showLogin").onclick = showLoginForm;

  // Landing on /signup opens straight to the signup form; /dashboard opens to login.
  if (window.location.pathname.replace(/\/$/, "") === "/signup") showSignupForm();

  // Auto-fill the store link from the business name, unless they've edited it themselves.
  let slugTouchedByUser = false;
  document.getElementById("signup-slug").addEventListener("input", () => { slugTouchedByUser = true; });
  document.getElementById("signup-name").addEventListener("input", (e) => {
    if (!slugTouchedByUser){
      document.getElementById("signup-slug").value = slugify(e.target.value);
    }
  });

  document.getElementById("login-btn").onclick = async () => {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errorEl = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");

    btn.textContent = "Logging in...";
    btn.disabled = true;

    try {
      const { error } = await getSupabase().auth.signInWithPassword({ email, password });
      if (error) throw error;
      errorEl.textContent = "";
      errorEl.classList.remove("show");
      await checkLogin();
    } catch (err) {
      console.error("Veacasy login error:", err);
      errorEl.textContent = err.message || "Login failed. Please try again.";
      errorEl.classList.add("show");
    } finally {
      btn.textContent = "Log in";
      btn.disabled = false;
    }
  };

  document.getElementById("signup-btn").onclick = async () => {
    const businessName = document.getElementById("signup-name").value.trim();
    const slug = document.getElementById("signup-slug").value.trim();
    const whatsapp = document.getElementById("signup-whatsapp").value.trim();
    const email = document.getElementById("signup-email").value.trim();
    const password = document.getElementById("signup-password").value;
    const errorEl = document.getElementById("signup-error");
    const btn = document.getElementById("signup-btn");

    errorEl.textContent = "";
    errorEl.classList.remove("show");

    if (!businessName || !slug || !whatsapp || !email || !password){
      errorEl.textContent = "Please fill in every field.";
      errorEl.classList.add("show");
      return;
    }

    btn.textContent = "Creating store...";

    // Step 1 — create the actual login.
    // (If an earlier attempt already created this login, reuse it instead of failing.)
    let data, signUpErr = null;
    const { data: { session: existingSession } } = await getSupabase().auth.getSession();
    if (existingSession && existingSession.user && (existingSession.user.email || "").toLowerCase() === email.toLowerCase()){
      data = { user: existingSession.user, session: existingSession };
    } else {
      ({ data, error: signUpErr } = await getSupabase().auth.signUp({ email, password }));
    }

    if (signUpErr){
      errorEl.textContent = signUpErr.message;
      errorEl.classList.add("show");
      btn.textContent = "Create store";
      btn.disabled = false;
      return;
    }

    // If email confirmation is required in Supabase's Auth settings, there's no
    // session yet — the vendor row can't be created until they confirm and log
    // in, since RLS only allows inserting a row that matches your own logged-in id.
    if (!data.session){
      errorEl.textContent = "";
      showLoginForm();
      document.getElementById("login-error").textContent = "Account created — check your email to confirm it, then log in.";
      document.getElementById("login-error").classList.add("show");
      btn.textContent = "Create store";
      btn.disabled = false;
      return;
    }

    // Step 2 — create the store through one database function. It checks the
    // invite code, creates the store on a 14-day free trial (20 products) and
    // uses up the code, all in one step, so a store can't exist without a valid code.
    const { error: storeErr } = await getSupabase().rpc("create_store", {
      p_business_name: businessName,
      p_slug: slug,
      p_whatsapp: whatsapp,
    });

    btn.textContent = "Create store";
    btn.disabled = false;

    if (storeErr){
      console.error("create_store failed:", storeErr);
      errorEl.textContent = storeErr.message || "Couldn't create your store. Please try again.";
      errorEl.classList.add("show");
      return; // the login exists but has no store yet: retrying with the same email now works
    }

    currentVendorId = data.user.id;
    await checkLogin(); // loads their brand-new store straight into the dashboard
  };

  document.getElementById("logoutBtn").onclick = async () => {
    if (inactivityTimer) clearTimeout(inactivityTimer);
    await getSupabase().auth.signOut({ scope: "local" });
    currentVendorId = null;
    document.getElementById("login-email").value = "";
    document.getElementById("login-password").value = "";
    showLoginForm();
    checkLogin();
  };

  checkLogin().catch((err) => {
    console.error("Veacasy startup error:", err);
    const errorEl = document.getElementById("login-error");
    if (errorEl) {
      errorEl.textContent = err.message || "Veacasy could not connect. Please refresh the page.";
      errorEl.classList.add("show");
    }
  });
</script>

</body>
</html>
