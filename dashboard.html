<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veacasy — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<style>
  :root{
    --ink:#1E2B22;
    --paper:#EEF3EC;
    --panel:#FAFBF7;
    --accent:#2196F3; /* new-signup default — blue, until a seller picks their own */
    --line:#CBD9CD;
    --muted:#6E7C71;
    /* Fixed Veacasy brand colors — the login/signup screen always uses these two,
       never the dynamic --accent tokens above, regardless of any vendor's theme. */
    --brand-blue:#2196F3;
    --brand-white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto; padding:24px 18px 80px;}

  header{
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo-slot{
    flex:none;
    width:52px; height:52px;
    border-radius:10px;
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden;
    color:var(--muted);
    font-size:10.5px;
    text-align:center;
    line-height:1.2;
  }
  .logo-slot img{
    width:100%; height:100%;
    object-fit:cover;
  }
  .logo-slot:hover{ color:var(--accent); }
  .eyebrow{font-size:12.5px; color:var(--muted); margin:0 0 4px;}
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:0;
  }

  nav{
    display:flex;
    gap:6px;
    background:var(--line);
    padding:4px;
    border-radius:10px;
    margin-bottom:20px;
  }
  nav button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink);
    border-radius:7px;
    cursor:pointer;
  }
  nav button.active{ background:var(--panel); }

  .panel{
    background:var(--panel);
    box-shadow:0 1px 3px rgba(30,43,34,0.06);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .row-between h2{
    font-family:'Fraunces', serif;
    font-size:17px;
    margin:0;
    font-weight:600;
  }
  .add-btn{
    background:var(--accent);
    color:var(--panel);
    border:none;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .category-select{
    background:var(--paper);
    color:var(--ink);
    border:none;
    border-radius:7px;
    padding:7px 9px;
    font-family:'Work Sans', sans-serif;
    font-size:12.5px;
    cursor:pointer;
  }

  /* Store link block */
  .color-swatches{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
  }
  .color-swatch{
    width:30px; height:30px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .color-swatch.selected{
    border-color:var(--ink);
    box-shadow:0 0 0 2px var(--panel);
  }
  .link-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper);
    border:none;
    border-radius:7px;
    padding:9px 10px;
  }
  .link-row .url{
    flex:1;
    min-width:0;
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .copy-btn{
    flex:none;
    background:var(--accent);
    color:var(--panel);
    border:none;
    font-size:12px;
    font-weight:500;
    padding:6px 11px;
    border-radius:6px;
    cursor:pointer;
  }
  .copy-btn.ghost{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
  }

  .product{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .product:last-child{border-bottom:none;}
  .swatch{
    flex:none;
    width:46px; height:46px;
    border-radius:6px;
    background:var(--accent);
    color:var(--panel);
    font-family:'Fraunces', serif;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .swatch img{ width:100%; height:100%; object-fit:cover; }
  .p-details{flex:1; min-width:0;}
  .p-name{font-size:14.5px; font-weight:500; margin:0 0 2px;}
  .p-meta{font-size:12.5px; color:var(--muted); margin:0;}

  .toggle{
    flex:none;
    width:38px; height:22px;
    border-radius:999px;
    background:var(--line);
    position:relative;
    cursor:pointer;
    border:none;
    padding:0;
  }
  .toggle.on{ background:var(--accent); }
  .toggle .dot{
    position:absolute; top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--panel);
    transition:transform .15s ease;
  }
  .toggle.on .dot{ transform:translateX(16px); }

  .actions{
    flex:none;
    display:flex;
    gap:2px;
  }
  .icon-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:15px;
    cursor:pointer;
    padding:4px 5px;
    line-height:1;
  }
  .icon-btn:hover{ color:var(--ink); }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    padding:24px 0;
  }

  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin:12px 0 5px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], input[type=tel], textarea, select{
    width:100%;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:7px;
    padding:9px 11px;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:56px;}
  input[type=color]{
    width:44px; height:34px;
    border:1px solid var(--line);
    border-radius:7px;
    padding:2px;
    background:var(--paper);
  }
  .file-drop{
    background:var(--paper);
    border-radius:7px;
    padding:16px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
  }

  .form-actions{
    display:flex; gap:8px; margin-top:16px;
  }
  .btn{
    flex:1;
    border:none;
    padding:10px 0;
    border-radius:7px;
    font-family:'Work Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
  }
  .btn.save{ background:var(--accent); color:var(--panel); }
  .btn.cancel{ background:var(--line); color:var(--ink); }

  .toast{
    position:fixed;
    bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  /* Login / signup gate — fixed Veacasy brand colors only (blue + white).
     Deliberately NOT using --accent/--paper/--ink etc: those get overwritten
     by applyTheme() once a vendor logs in, and this screen must never change
     no matter whose theme was last active in this browser tab. */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 18px;
    background:#FFFFFF;
  }
  .login-card{
    width:100%;
    max-width:360px;
    background:#FFFFFF;
    border-radius:16px;
    padding:36px 30px 30px;
    box-shadow:0 4px 24px rgba(33,150,243,0.12);
  }
  .login-logo{
    width:52px; height:52px;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .login-logo img{ width:100%; height:100%; object-fit:contain; }
  .login-card h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
    margin:0 0 5px;
    letter-spacing:-0.01em;
    color:#12202E;
  }
  .login-card p{
    font-size:13px;
    color:#5B6B7A;
    margin:0 0 26px;
    line-height:1.4;
  }
  .login-field{ margin-bottom:16px; text-align:left; }
  .login-field label{
    display:block;
    font-size:12px;
    font-weight:500;
    color:#5B6B7A;
    margin-bottom:6px;
  }
  .login-card input{
    width:100%;
    border:1.5px solid #D9E4EC;
    background:#FAFCFE;
    border-radius:9px;
    padding:11px 13px;
    font-family:'Work Sans', sans-serif;
    font-size:14.5px;
    color:#12202E;
    transition:border-color .15s ease;
  }
  .login-card input:focus{
    outline:none;
    border-color:#2196F3;
  }
  .login-btn{
    width:100%;
    background:#2196F3;
    color:#FFFFFF;
    border:none;
    padding:12px 0;
    border-radius:9px;
    font-family:'Work Sans', sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
    letter-spacing:0.01em;
  }
  .login-btn:active{ opacity:0.9; }
  .login-switch{
    text-align:center;
    font-size:13px;
    color:#5B6B7A;
    margin-top:18px;
  }
  .login-switch button{
    background:none;
    border:none;
    color:#2196F3;
    font-weight:600;
    cursor:pointer;
    font-size:13px;
    padding:0;
  }
  .login-error{
    color:#a83232;
    background:rgba(168,50,50,0.08);
    border-radius:7px;
    font-size:12.5px;
    padding:9px 11px;
    margin:0 0 16px;
    display:none;
  }
  .login-error.show{ display:block; }
  .logout-link{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginGate">
  <div class="login-card">
    <div class="login-logo"><img src="veacasy-logo.jpeg" alt="Veacasy"></div>

    <div id="loginForm">
      <h1>Welcome back</h1>
      <p>Log in to manage your store</p>
      <p class="login-error" id="login-error"></p>
      <div class="login-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="login-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="login-btn" id="login-btn">Log in</button>
      <p class="login-switch">New to Veacasy? <button id="showSignup">Create your store</button></p>
    </div>

    <div id="signupForm" style="display:none;">
      <h1>Create your store</h1>
      <p>Set up your Veacasy catalog in a couple minutes</p>
      <p class="login-error" id="signup-error"></p>
      <div class="login-field">
        <label for="signup-name">Business name</label>
        <input type="text" id="signup-name" placeholder="e.g. Sparkles by Annie">
      </div>
      <div class="login-field">
        <label for="signup-slug">Your store link</label>
        <input type="text" id="signup-slug" placeholder="auto-fills from business name">
      </div>
      <div class="login-field">
        <label for="signup-whatsapp">WhatsApp number</label>
        <input type="tel" id="signup-whatsapp" placeholder="2348012345678">
      </div>
      <div class="login-field">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com">
      </div>
      <div class="login-field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="At least 6 characters">
      </div>
      <div class="login-field">
        <label for="signup-invite">Invite code</label>
        <input type="text" id="signup-invite" placeholder="Given to you by Veacasy">
      </div>
      <button class="login-btn" id="signup-btn">Create store</button>
      <p class="login-switch">Already have a store? <button id="showLogin">Log in</button></p>
    </div>
  </div>
</div>

<div id="dashboardContent" style="display:none;">
<div class="wrap">
  <header>
    <div class="logo-slot" id="logoSlot">+ Logo</div>
    <div>
      <p class="eyebrow">Your store</p>
      <h1>Dashboard</h1>
    </div>
    <input type="file" id="logoInput" accept="image/*" style="display:none;">
  </header>

  <nav>
    <button class="active" data-tab="products">Products</button>
    <button data-tab="settings">Store Settings</button>
  </nav>

  <div id="productsTab"></div>
  <div id="settingsTab" style="display:none;"></div>

  <p style="text-align:center; margin-top:10px;">
    <button class="logout-link" id="logoutBtn">Log out</button>
  </p>
</div>
</div>

<div class="toast" id="toast">Saved</div>


<script>
  // ─── SUPABASE CONNECTION ──────────────────────────────────────
  // Paste your own project's values here — Supabase dashboard →
  // Settings → API. Safe to leave visible in this file: RLS is what
  // actually protects the data, not hiding this key.
  const SUPABASE_URL = "https://bfirghwabailetfuepyh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_eKf6tIadS8Fq-wzSTl95hw_UcrELF5p";
  let supabaseClient = null;

  function getSupabase(){
    if (supabaseClient) return supabaseClient;
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      throw new Error("Veacasy could not load its backend connection. Please refresh the page. If this keeps happening, the Supabase library is being blocked from loading.");
    }
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    return supabaseClient;
  }

  const DOMAIN = "veacasy.vercel.app"; // update to veacasy.com once that domain is live

  let products = [];
  let settings = {};
  let currentVendorId = null; // the logged-in vendor's row id — same as their auth id

  // Pulls this vendor's row + their products, the moment they log in.
  async function loadVendorData(){
    const { data: vendor, error: vendorErr } = await supabase
      .from("vendors")
      .select("*")
      .eq("id", currentVendorId)
      .single();

    if (vendorErr || !vendor){
      throw new Error("No store found for this account yet — ask whoever set up your login to link your vendor row.");
    }

    settings = {
      businessName: vendor.business_name || "",
      tagline: vendor.tagline || "",
      whatsapp: vendor.whatsapp_number || "",
      contactEmail: vendor.contact_email || "",
      phone: vendor.phone_number || "",
      address: vendor.address || "",
      slug: vendor.slug || "",
      accent: vendor.accent_color || "#2196F3",
      logoUrl: vendor.logo_url,
    };

    const { data: rows, error: productsErr } = await supabase
      .from("products")
      .select("*")
      .eq("vendor_id", currentVendorId);

    if (productsErr) throw productsErr;

    products = (rows || []).map(p => ({
      id: p.id,
      code: p.code,
      name: p.name,
      price: p.price,
      category: p.category || "",
      inStock: p.in_stock,
      description: p.description || "",
      photoUrl: p.photo_url,
    }));
  }

  // Uploads a picked File to Storage and returns its public URL.
  // Used for both product photos and the store logo.
  async function uploadPhoto(file, folder){
    const path = `${folder}/${currentVendorId}/${Date.now()}-${file.name}`;
    const { error } = await getSupabase().storage.from("product-photos").upload(path, file);
    if (error) throw error;
    const { data } = getSupabase().storage.from("product-photos").getPublicUrl(path);
    return data.publicUrl;
  }

  let editingId = null; // null = list view, "new" = add form, number = editing that product
  let categoryFilter = "All"; // dashboard-side category filter, doesn't affect the live catalog
  let formPhotoUrl = null; // preview shown in the form
  let formPhotoFile = null; // the actual File, uploaded only when Save is clicked

  function photoDropInner(){
    return formPhotoUrl
      ? `<img src="${formPhotoUrl}" alt="Product photo" style="width:100%;max-width:120px;height:80px;object-fit:cover;border-radius:6px;">`
      : "Tap to upload a photo";
  }

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1400);
  }

  function money(n){ return "₦" + Number(n).toLocaleString(); }
  function initials(name){ return name.trim().charAt(0); }

  function hexToHsl(hex){
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
    const r = parseInt(hex.substr(0,2),16)/255, g = parseInt(hex.substr(2,2),16)/255, b = parseInt(hex.substr(4,2),16)/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h, s, l = (max+min)/2;
    if (max === min){ h = s = 0; }
    else{
      const d = max - min;
      s = l > 0.5 ? d/(2-max-min) : d/(max+min);
      switch(max){
        case r: h = (g-b)/d + (g<b?6:0); break;
        case g: h = (b-r)/d + 2; break;
        default: h = (r-g)/d + 4;
      }
      h /= 6;
    }
    return { h: h*360, s: s*100, l: l*100 };
  }

  function hslToHex(h, s, l){
    s/=100; l/=100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const toHex = x => Math.round(255*x).toString(16).padStart(2,"0");
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
  }

  // Picking one accent color re-tints the whole page — background, panels,
  // borders and text all shift to the same hue, just at very different
  // lightness levels so contrast stays readable no matter what's picked.
  function applyTheme(accentHex){
    const { h, s, l } = hexToHsl(accentHex);
    const isNeutral = s < 4; // true black / white / gray — hue is meaningless here, don't fake a tint
    const maxAccentLightness = 55; // caps how pale the accent can be, so light button text stays readable
    const safeL = Math.min(l, maxAccentLightness); // black (l=0) passes straight through untouched
    const safeAccentHex = hslToHex(h, s, safeL);
    const bgS = tone => isNeutral ? 0 : tone; // neutral picks get a true gray theme, not a false tint

    const root = document.documentElement.style;
    root.setProperty("--accent", safeAccentHex);
    root.setProperty("--paper", hslToHex(h, bgS(22), 93));
    root.setProperty("--panel", hslToHex(h, bgS(20), 98));
    root.setProperty("--line", hslToHex(h, bgS(22), 82));
    root.setProperty("--muted", hslToHex(h, bgS(14), 42));
    root.setProperty("--ink", hslToHex(h, bgS(22), 14));
    return safeAccentHex;
  }
  function slugify(str){
    return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }
  function storeUrl(){ return `${DOMAIN}/${settings.slug}/`; }
  function productUrl(p){ return `${DOMAIN}/${settings.slug}/#${p.code}`; }

  function copyToClipboard(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText("https://" + text).catch(() => {});
    }
    showToast("Link copied");
  }

  function renderProductsTab(){
    const el = document.getElementById("productsTab");

    if (editingId !== null){
      const isNew = editingId === "new";
      const p = isNew
        ? { name:"", price:"", category:"", description:"" }
        : products.find(x => x.id === editingId);
      formPhotoUrl = p.photoUrl || null;
      formPhotoFile = null;

      el.innerHTML = `
        <div class="panel">
          <div class="row-between"><h2>${isNew ? "Add product" : "Edit product"}</h2></div>
          <label>Photo</label>
          <div class="file-drop" id="productPhotoDrop" style="cursor:pointer;">${photoDropInner()}</div>
          <input type="file" id="productPhotoInput" accept="image/*" style="display:n
