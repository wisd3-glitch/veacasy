<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEACASY Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<style>
.wrap{max-width:560px;margin:0 auto;padding-bottom:150px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--hero);color:#fff}
.top a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gal{position:relative;background:var(--hero);padding:0 16px 22px;border-radius:0 0 28px 28px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;background:var(--soft);scrollbar-width:none;aspect-ratio:1/1}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;scroll-snap-align:center;display:grid;place-items:center;font-size:80px;font-weight:800;color:var(--blue);opacity:1;padding:0;cursor:zoom-in}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.cnt{position:absolute;right:30px;bottom:34px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.body{padding:20px 18px 0}
.store{font-size:13px;color:var(--mute);margin:0 0 4px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pr{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.price{font-size:26px;font-weight:800;color:var(--price,var(--blue))}
.stock{font-size:13px;font-weight:600;color:var(--ok)}.stock.out{color:var(--danger)}
.cat{display:inline-block;background:var(--soft);color:var(--mute);font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;margin-bottom:12px}
.desc{font-size:15px;line-height:1.6;color:var(--mute);margin:0 0 18px;white-space:pre-line}
.qrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:600}
.qty{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:14px;padding:4px}
.qty button{width:38px;height:38px;border-radius:11px;background:var(--card);font-size:20px;font-weight:700}
.qty b{min-width:20px;text-align:center}
.btn{display:block;width:100%;border-radius:16px;padding:15px;font-weight:700;font-size:16px;text-align:center;text-decoration:none;margin-bottom:10px}
.primary{background:var(--blue);color:#fff}
.second{background:var(--card);color:var(--price,var(--blue));border:2px solid var(--price,var(--blue))}
.rec h2{font-size:18px;margin:26px 0 12px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit}
.rp{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--blue)}
.rp img{width:100%;height:100%;object-fit:cover}
.ri{padding:9px 11px 11px;font-size:13.5px;font-weight:600}.ri span{display:block;color:var(--blue);font-weight:800;margin-top:2px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(530px,calc(100% - 28px));background:var(--ink);color:var(--bg);border-radius:18px;padding:15px 18px;display:flex;justify-content:space-between;font-weight:700;text-decoration:none;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cartbar[hidden]{display:none}
.zoom{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:grid;place-items:center}
.zoom[hidden]{display:none}.zoom img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#0d1433;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.msgbox{text-align:center;padding:60px 20px}.msgbox h2{font-size:24px;margin:0 0 8px}.msgbox p{color:var(--mute);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msgbox"><p>Loading product…</p></div></div>
<div class="zoom" id="zoom" hidden><img id="zimg" alt=""></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL="https://bfirghwabailetfuepyh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_eKf6tIadS8Fq-wzSTl95hw_UcrELF5p";
let client=null,vendor=null,product=null,qty=1,cart={};
const $=id=>document.getElementById(id);
function getSupabase(){
  if(client)return client;
  if(!window.supabase||typeof window.supabase.createClient!=="function")throw new Error("Veacasy could not connect. Please refresh the page.");
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  return client;
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function money(n){const v=Number(n||0),d=Number.isInteger(v)?0:2,cur=(vendor&&vendor.currency)||"NGN";try{return new Intl.NumberFormat("en",{style:"currency",currency:cur,currencyDisplay:"narrowSymbol",minimumFractionDigits:d,maximumFractionDigits:d}).format(v)}catch(e){return cur+" "+v.toLocaleString()}}
function initial(n){return esc((n||"?").trim().charAt(0).toUpperCase());}
function imgs(p){const a=Array.isArray(p.photo_urls)?p.photo_urls.filter(Boolean):[];return a.length?a:(p.photo_url?[p.photo_url]:[]);}
function params(){const q=new URLSearchParams(location.search),parts=location.pathname.split("/").filter(Boolean);return{slug:q.get("slug")||decodeURIComponent(parts[0]||""),code:q.get("code")||decodeURIComponent(parts[1]||"")};}
function applyBrand(hex){
  /* Seller colour -> header gradient, buttons, prices. Veacasy blue is used when no colour was picked. */
  if(!/^#[0-9a-f]{6}$/i.test(hex||"")||hex.toLowerCase()==="#2196f3")return;
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0,s=0,l=(mx+mn)/2;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360;}
  s=Math.round(s*100);l=Math.min(Math.round(l*100),55);
  const dark=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches,st=document.documentElement.style;
  const c1="hsl("+h+","+s+"%,"+l+"%)",c2="hsl("+h+","+s+"%,"+Math.max(l-16,6)+"%)";
  st.setProperty("--blue",c1);st.setProperty("--blue2",c2);st.setProperty("--seller",c1);
  st.setProperty("--hero","linear-gradient(160deg,"+c1+","+c2+")");
  st.setProperty("--soft",dark?"hsl("+h+","+Math.round(s*.5)+"%,18%)":"hsl("+h+","+Math.round(s*.8)+"%,94%)");
  st.setProperty("--price",dark?"hsl("+h+","+s+"%,72%)":c1);
}
function toast(t){const e=$("toast");e.textContent=t;e.className="toast show";clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="toast",2000);}
function track(type,pid){try{getSupabase().from("events").insert({vendor_id:vendor.id,product_id:pid==null?null:String(pid),type}).then(()=>{},()=>{});}catch(e){}}
const ckey=()=>"veacasy_cart_"+vendor.slug;
function loadCart(){try{cart=JSON.parse(sessionStorage.getItem(ckey())||"{}")||{};}catch(e){cart={};}}
function saveCart(){try{sessionStorage.setItem(ckey(),JSON.stringify(cart));}catch(e){}}
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function drawBar(){const n=count(),b=$("bar");b.hidden=!n;b.innerHTML=`<span>View cart · ${n} ${n===1?"item":"items"}</span><span>Open ›</span>`;}
function vendorIsActive(v){
  if(!v)return false;if(v.status&&v.status!=="active")return false;const now=Date.now();
  if(v.plan==="trial"&&v.trial_ends_at&&new Date(v.trial_ends_at).getTime()<=now)return false;
  if(v.expires_at&&new Date(v.expires_at).getTime()<=now)return false;return true;
}
function fail(h,t,x){$("app").innerHTML=`<div class="msgbox"><h2>${h}</h2><p>${t}</p>${x||""}</div>`;}
function draw(related){
  const v=vendor,p=product,im=imgs(p),link=`/${encodeURIComponent(v.slug)}/`;
  $("app").innerHTML=`<div class="top"><a href="${link}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>Back to ${esc(v.business_name||"store")}</a></div>
  <div class="gal"><div class="slides" id="slides">${im.length?im.map(u=>`<button type="button" class="slide" data-z="${esc(u)}" aria-label="Enlarge photo"><img src="${esc(u)}" alt="${esc(p.name)}"></button>`).join(""):`<div class="slide" style="cursor:default">${initial(p.name)}</div>`}</div>${im.length>1?`<span class="cnt" id="cnt">1/${im.length}</span>`:""}</div>
  <div class="body"><p class="store">${esc(v.business_name||"")}</p><h1>${esc(p.name)}</h1>
  <div class="pr"><span class="price">${money(p.price)}</span><span class="stock ${p.in_stock?"":"out"}">${p.in_stock?"In stock":"Currently unavailable"}</span></div>
  ${p.category?`<span class="cat">${esc(p.category)}</span>`:""}${p.description?`<p class="desc">${esc(p.description)}</p>`:""}
  ${p.in_stock?`<div class="qrow"><span>Quantity</span><div class="qty"><button id="mi" aria-label="Fewer">−</button><b id="q">1</b><button id="pl" aria-label="More">+</button></div></div>
  <button class="btn primary" id="add">Add to cart</button><a class="btn second" id="now" href="#" rel="noopener">Order this on WhatsApp</a>`:`<p class="desc">This product can’t be ordered right now.</p>`}
  ${related.length?`<section class="rec"><h2>You may also like</h2><div class="rg">${related.map(r=>`<a class="rc" href="/${encodeURIComponent(v.slug)}/${encodeURIComponent(r.code)}/"><div class="rp">${imgs(r)[0]?`<img src="${esc(imgs(r)[0])}" alt="${esc(r.name)}" loading="lazy">`:initial(r.name)}</div><div class="ri">${esc(r.name)}<span>${money(r.price)}</span></div></a>`).join("")}</div></section>`:""}</div>
  <a class="cartbar" id="bar" href="${link}?cart=1" hidden></a>`;
  drawBar();
  const s=$("slides");
  if(s)s.addEventListener("scroll",()=>{const c=$("cnt");if(c)c.textContent=(Math.round(s.scrollLeft/s.clientWidth)+1)+"/"+im.length;});
  if(s)s.addEventListener("click",e=>{const b=e.target.closest("[data-z]");if(b){$("zimg").src=b.dataset.z;$("zoom").hidden=false;}});
  if(p.in_stock){
    $("mi").onclick=()=>{qty=Math.max(1,qty-1);$("q").textContent=qty;};
    $("pl").onclick=()=>{qty=Math.min(99,qty+1);$("q").textContent=qty;};
    $("add").onclick=()=>{cart[p.code]=(cart[p.code]||0)+qty;saveCart();drawBar();toast(`${qty} added to cart`);};
    $("now").onclick=e=>{
      e.preventDefault();const n=String(v.whatsapp_number||"").replace(/\D/g,"");
      if(!n){toast("This seller has not added a WhatsApp number yet.");return;}
      track("order_sent",p.id);
      const t=`Hello ${v.business_name||"there"}, I’d like to order ${qty}× ${p.name} (${money(qty*Number(p.price||0))}).`;
      window.open(`https://wa.me/${n}?text=${encodeURIComponent(t)}`,"_blank","noopener");
    };
  }
}
$("zoom").onclick=()=>$("zoom").hidden=true;
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("zoom").hidden=true;});
async function loadProduct(){
  try{
    const{slug,code}=params();if(!slug||!code)throw new Error("Product link not found.");
    const{data:v,error:ve}=await getSupabase().from("vendors").select("id,business_name,tagline,whatsapp_number,contact_email,phone_number,address,slug,accent_color,logo_url,plan,status,trial_ends_at,expires_at,currency").eq("slug",slug).single();
    if(ve||!v)throw new Error("Store not found.");vendor=v;
    if(!vendorIsActive(v)){fail("Temporarily unavailable",`${esc(v.business_name||"This store")} is temporarily unavailable. Please check back soon.`,`<p style="font-size:12.5px"><a href="/dashboard/">Store owner? Log in</a></p>`);return;}
    const base="id,code,name,price,category,description,in_stock,photo_url";let multi=true;
    let res=await getSupabase().from("products").select(base+",photo_urls").eq("vendor_id",v.id).eq("code",code).single();
    if(res.error&&/photo_urls/i.test(res.error.message||"")){multi=false;res=await getSupabase().from("products").select(base).eq("vendor_id",v.id).eq("code",code).single();}
    if(res.error||!res.data)throw new Error("Product not found.");
    product=res.data;
    const rc="id,code,name,price,category,photo_url"+(multi?",photo_urls":"");
    let related=[];
    if(product.category){const r=await getSupabase().from("products").select(rc).eq("vendor_id",v.id).eq("category",product.category).neq("code",product.code).order("id",{ascending:false}).limit(6);related=r.data||[];}
    if(related.length<6){const r=await getSupabase().from("products").select(rc).eq("vendor_id",v.id).neq("code",product.code).order("id",{ascending:false}).limit(6);const seen=new Set(related.map(x=>x.code));for(const it of(r.data||[])){if(!seen.has(it.code)){related.push(it);seen.add(it.code);}if(related.length>=6)break;}}
    document.title=`${product.name||"Product"} — ${v.business_name||"VEACASY"}`;
    applyBrand(v.accent_color);loadCart();draw(related);
  }catch(err){fail("Product unavailable",esc(err.message||"This product could not be loaded."));}
}
loadProduct();
</script>
</body>
</html>
