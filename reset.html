<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Reset password · VEACASY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/theme.css"><style>body{line-height:1.5}.c{max-width:420px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 22px;width:calc(100% - 28px)}h1{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:12px 0 4px}.m{color:var(--mute);font-size:14px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)}.btn{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}.er{color:var(--danger);font-size:13px;min-height:18px}a{color:var(--blue);font-weight:600}.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer}@media(prefers-color-scheme:dark){a,.pw button{color:#8fb0ff}}</style></head><body><div class="c">
<a href="/dashboard/" style="font-size:14px;text-decoration:none">← Back to login</a><h1 id="h"></h1><p id="s" class="m"></p>
<div id="req" style="display:none"><label for="em">Login email</label><input id="em" type="email" autocomplete="email"><label for="wa">WhatsApp number on your store</label><input id="wa" type="tel" inputmode="tel"><button class="btn" id="rq">Request reset</button></div>
<div id="set" style="display:none"><label for="p1">New password</label><div class="pw"><input id="p1" type="password" autocomplete="new-password"><button type="button" id="tg">Show</button></div><label for="p2">Confirm password</label><input id="p2" type="password" autocomplete="new-password"><button class="btn" id="sv">Save new password</button></div>
<div id="wd" style="display:none"><a class="btn" id="wal" target="_blank" rel="noopener">Message support on WhatsApp</a></div>
<div id="ok" style="display:none"><a class="btn" href="/dashboard/">Log in</a></div><p id="er" class="er"></p></div>
<script>
const sb=supabase.createClient("https://bfirghwabailetfuepyh.supabase.co","sb_publishable_eKf6tIadS8Fq-wzSTl95hw_UcrELF5p");
const $=i=>document.getElementById(i),tok=location.hash.slice(1),show=i=>$(i).style.display="block",er=m=>$("er").textContent=m||"";
if(tok.length>=32){$("h").textContent="Set a new password";$("s").textContent="Choose a new password for your store. This link works once.";show("set")}
else{$("h").textContent="Forgot your password?";$("s").textContent="Enter your account details. We confirm it's you on WhatsApp, then send you a secure reset link.";show("req")}
$("rq").onclick=async()=>{const e=$("em").value.trim(),w=$("wa").value.trim();if(!e||!w)return er("Please fill in both fields.");er();$("rq").disabled=true;
const{error}=await sb.rpc("request_password_reset",{p_email:e,p_whatsapp:w});$("rq").disabled=false;if(error)return er("Something went wrong. Please try again.");
$("req").style.display="none";$("h").textContent="Request received";$("s").textContent="To protect your account, we confirm it's you on WhatsApp before sending a reset link. Tap below and send the message.";
$("wal").href="https://wa.me/2347026438309?text="+encodeURIComponent("Hi VEACASY, I forgot my password. My login email is "+e+". Please help me reset it.");show("wd")};
$("tg").onclick=()=>{const s=$("p1").type==="password";$("p1").type=$("p2").type=s?"text":"password";$("tg").textContent=s?"Hide":"Show"};
$("sv").onclick=async()=>{const a=$("p1").value;if(a.length<8)return er("Use at least 8 characters.");if(a!==$("p2").value)return er("The passwords don't match.");er();$("sv").disabled=true;
const{error}=await sb.rpc("redeem_reset_token",{p_token:tok,p_password:a});$("sv").disabled=false;if(error)return er(error.message);
history.replaceState(null,"","/reset");$("set").style.display="none";$("h").textContent="Password updated";$("s").textContent="You can now log in with your new password.";show("ok")};
</script></body></html>
