<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEACASY Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<style>

:root{--ink:#172033;--paper:#f5f6f8;--panel:#fff;--accent:#1769f5;--line:#e5e7eb;--muted:#697386;--green:#18a875}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 54px}
.brandbar{display:flex;align-items:center;gap:10px;padding:15px 0 13px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brandbar img{width:34px;height:34px;object-fit:contain;border-radius:7px}
.brandword{font-size:14px;font-weight:700;letter-spacing:.19em}
header.store-head{display:flex;align-items:center;gap:15px;margin-bottom:23px}
.logo{width:70px;height:70px;flex:none;border-radius:50%;background:#101827;overflow:hidden;display:flex;align-items:center;justify-content:center;color:white;font:25px 'Fraunces',serif}
.logo img{width:100%;height:100%;object-fit:cover}
.eyebrow{font-size:12px;color:var(--muted);margin:0 0 5px}
h1{font:600 clamp(25px,4vw,34px)/1.1 'Fraunces',Georgia,serif;margin:0}
.tagline{font-size:14px;color:var(--muted);margin:7px 0 0;line-height:1.45}
.search-panel{margin-bottom:17px}
.search{width:100%;border:1px solid #e1e4e9;background:#fff;border-radius:13px;padding:15px 17px;font:15px 'Work Sans',sans-serif;color:var(--ink);outline:none;box-shadow:0 3px 12px rgba(20,30,50,.04)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,105,245,.12)}
.categories{display:flex;gap:9px;overflow-x:auto;padding:3px 1px 13px;margin-bottom:8px;scrollbar-width:thin}
.cat{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:10px 16px;font:500 13px 'Work Sans',sans-serif;white-space:nowrap;cursor:pointer;flex:none}
.cat.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(23,105,245,.22)}
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.product-card{min-width:0;background:var(--panel);border:1px solid #eceef1;border-radius:16px;overflow:hidden;box-shadow:0 5px 18px rgba(18,32,56,.06);display:flex;flex-direction:column}
.product-link{cursor:pointer;text-decoration:none;color:inherit}
.product-link:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.photo-link{display:block;width:100%;border:0;padding:0;background:#eef0f3;aspect-ratio:1.08/1;overflow:hidden;cursor:pointer}
.photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#e9edf3;color:var(--accent);font:34px 'Fraunces',serif}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.details{padding:13px 13px 14px;display:flex;flex-direction:column;align-items:stretch;flex:1;min-width:0}
.name{font-size:15px;font-weight:600;line-height:1.35;margin:0 0 6px;cursor:pointer}
.price{font-size:17px;font-weight:700;color:var(--accent);margin:0 0 7px}
.category{font-size:12px;color:var(--muted);margin:0 0 8px}
.description{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stock{font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--green);margin:0 0 11px}
.stock:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.stock.out{color:#9a5b5b}
.order{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;padding:11px 9px;font-size:12px;font-weight:600;text-align:center}
.order svg{width:17px;height:17px;flex:none}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:35px 12px;background:white;border-radius:14px;grid-column:1/-1}
.footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}
.footer a{color:var(--accent);text-decoration:none;font-weight:700}
.error{text-align:center;padding:50px 20px}.error h2{font:600 24px 'Fraunces',serif;margin:0 0 8px}.error p{color:var(--muted);font-size:14px;line-height:1.5}.loading{text-align:center;color:var(--muted);padding:45px 0;font-size:14px}
@media(min-width:760px){.wrap{padding-left:28px;padding-right:28px}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.photo-link{aspect-ratio:1.18/1}.details{padding:16px}.name{font-size:16px}.order{font-size:13px}}
@media(min-width:1020px){.product-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:390px){.wrap{padding-left:13px;padding-right:13px}.product-grid{gap:10px}.details{padding:10px}.name{font-size:13px}.price{font-size:15px}.order{font-size:11px;padding:10px 6px}.logo{width:60px;height:60px}}

</style>
</head>
<body><div class="wrap"><div id="app" class="loading">Loading store…</div></div>
<script>
const SUPABASE_URL="https://bfirghwabailetfuepyh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_eKf6tIadS8Fq-wzSTl95hw_UcrELF5p";
const DOMAIN="veacasy.vercel.app";
let client=null,vendor=null,products=[],activeCategory="All",searchTerm="";
function getInitialCategory(){return new URLSearchParams(location.search).get("category")||"All";}

function getSupabase(){
  if(client)return client;
  if(!window.supabase||typeof window.supabase.createClient!=="function")throw new Error("Veacasy could not load its backend connection. Please refresh the page.");
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  return client;
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function money(v){return "₦"+Number(v||0).toLocaleString();}
function initials(n){return escapeHtml((n||"?").trim().charAt(0).toUpperCase());}
function hexToHsl(hex){
  hex=String(hex||"#2196F3").replace("#","");if(hex.length===3)hex=hex.split("").map(c=>c+c).join("");
  const r=parseInt(hex.substr(0,2),16)/255,g=parseInt(hex.substr(2,2),16)/255,b=parseInt(hex.substr(4,2),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;
  if(max===min){h=s=0}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h/=6}
  return{h:h*360,s:s*100,l:l*100};
}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))),x=n=>Math.round(255*f(n)).toString(16).padStart(2,"0");return`#${x(0)}${x(8)}${x(4)}`;}
function applyTheme(hex){
  const{h,s,l}=hexToHsl(hex),neutral=s<4,root=document.documentElement.style;
  root.setProperty("--accent",hslToHex(h,s,Math.min(l,55)));
  root.setProperty("--paper",neutral?"#F2F2F2":hslToHex(h,22,93));
  root.setProperty("--panel",neutral?"#FAFAFA":hslToHex(h,20,98));
  root.setProperty("--line",neutral?"#D8D8D8":hslToHex(h,22,82));
  root.setProperty("--muted",neutral?"#666":hslToHex(h,14,42));
  root.setProperty("--ink",neutral?"#202020":hslToHex(h,22,14));
}
function getSlug(){const parts=location.pathname.split("/").filter(Boolean);return parts.length?decodeURIComponent(parts[parts.length-1]):"";}
function whatsappUrl(p){
  const n=String(vendor.whatsapp_number||"").replace(/\D/g,"");if(!n)return"#";
  const text=`Hi ${vendor.business_name||"there"}, I'm interested in ${p.name}${p.price!=null?" ("+money(p.price)+")":""}.`;
  return`https://wa.me/${n}?text=${encodeURIComponent(text)}`;
}
function filteredProducts(){const q=searchTerm.toLowerCase();return products.filter(p=>(activeCategory==="All"||(p.category||"")===activeCategory)&&(!q||[p.name,p.category,p.description].some(v=>String(v||"").toLowerCase().includes(q))));}
function render(){
  const app=document.getElementById("app"),cats=["All",...new Set(products.map(p=>p.category).filter(Boolean))],visible=filteredProducts();
  const waIcon='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 11.7a8.3 8.3 0 0 1-12.2 7.2L3 20l1.2-5A8.3 8.3 0 1 1 20.5 11.7Z"/><path d="M8.4 7.8c.3-.5.6-.5.9-.5h.5c.2 0 .4.1.5.4l.8 1.9c.1.2.1.4-.1.6l-.6.7c-.2.2-.2.4 0 .6.5.9 1.2 1.6 2.1 2.1.2.1.4.1.6-.1l.8-.9c.2-.2.4-.2.6-.1l1.8.9c.3.1.4.3.4.5 0 .5-.2 1.1-.6 1.4-.5.5-1.3.7-2.1.5-1.1-.3-2.5-1-3.8-2.3-1.1-1.1-2-2.7-2.2-3.7-.2-.8.1-1.5.5-2Z"/></svg>';
  app.className="";
  app.innerHTML=`<div class="brandbar"><img src="/veacasy-logo.jpeg" alt="VEACASY logo"><span class="brandword">VEACASY</span></div>
  <header class="store-head"><div class="logo">${vendor.logo_url?`<img src="${escapeHtml(vendor.logo_url)}" alt="${escapeHtml(vendor.business_name||"Store")} logo">`:initials(vendor.business_name)}</div><div><p class="eyebrow">Store</p><h1>${escapeHtml(vendor.business_name||"Store")}</h1>${vendor.tagline?`<p class="tagline">${escapeHtml(vendor.tagline)}</p>`:""}</div></header>
  <div class="search-panel"><input class="search" id="search" type="search" aria-label="Search products" placeholder="Search products…" value="${escapeHtml(searchTerm)}"></div>
  ${cats.length>1?`<nav class="categories" aria-label="Product categories">${cats.map(c=>`<button type="button" class="cat ${c===activeCategory?"active":""}" data-cat="${escapeHtml(c)}">${escapeHtml(c==="All"?"All Products":c)}</button>`).join("")}</nav>`:""}
  <div id="products" class="product-grid">${visible.length?visible.map(p=>`<article class="product-card" data-product-code="${escapeHtml(p.code||"")}" tabindex="0" role="link" aria-label="View ${escapeHtml(p.name)}">
    <button type="button" class="photo-link" data-open-product="${escapeHtml(p.code||"")}" aria-label="View ${escapeHtml(p.name)}"><div class="photo">${p.photo_url?`<img src="${escapeHtml(p.photo_url)}" alt="${escapeHtml(p.name)}" loading="lazy">`:initials(p.name)}</div></button>
    <div class="details"><p class="name" data-open-product="${escapeHtml(p.code||"")}">${escapeHtml(p.name)}</p><p class="price">${money(p.price)}</p>${p.category?`<p class="category">${escapeHtml(p.category)}</p>`:""}${p.description?`<p class="description">${escapeHtml(p.description)}</p>`:""}<p class="stock ${p.in_stock?"":"out"}">${p.in_stock?"In Stock":"Currently unavailable"}</p>${p.in_stock?`<a class="order" href="${whatsappUrl(p)}" target="_blank" rel="noopener">${waIcon}<span>Order on WhatsApp</span></a>`:`<div class="sold">Currently unavailable</div>`}</div></article>`).join(""):`<div class="empty">No products found. Try another search or category.</div>`}</div>
  <div class="footer">${vendor.contact_email?`<div>${escapeHtml(vendor.contact_email)}</div>`:""}${vendor.phone_number?`<div>${escapeHtml(vendor.phone_number)}</div>`:""}${vendor.address?`<div>${escapeHtml(vendor.address)}</div>`:""}<div style="margin-top:10px">Powered by <a href="https://${DOMAIN}/">VEACASY</a></div></div>`;
  const search=document.getElementById("search");
  search.addEventListener("input",e=>{searchTerm=e.target.value;const pos=search.selectionStart;render();const i=document.getElementById("search");i.focus();i.setSelectionRange(pos,pos);});
  document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{activeCategory=b.dataset.cat;const url=new URL(location.href);if(activeCategory==="All")url.searchParams.delete("category");else url.searchParams.set("category",activeCategory);history.replaceState({}, "", url.pathname+url.search+url.hash);render();}));
  function openProduct(code){if(code)location.href=`/${encodeURIComponent(vendor.slug)}/${encodeURIComponent(code)}/`;}
  document.querySelectorAll("[data-open-product]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();openProduct(el.dataset.openProduct);}));
  document.querySelectorAll(".product-card").forEach(card=>{card.addEventListener("click",e=>{if(e.target.closest("a,button"))return;openProduct(card.dataset.productCode);});card.addEventListener("keydown",e=>{if(e.target===card&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openProduct(card.dataset.productCode);}});});
  const hash=location.hash.replace("#","");if(hash){const t=document.getElementById(hash);if(t)setTimeout(()=>t.scrollIntoView({behavior:"smooth",block:"center"}),50);}
}
async function loadStore(){
  const app=document.getElementById("app");
  try{
    const slug=getSlug();if(!slug)throw new Error("Store link not found.");
    const{data:v,error:ve}=await getSupabase().from("vendors").select("id,business_name,tagline,whatsapp_number,contact_email,phone_number,address,slug,accent_color,logo_url").eq("slug",slug).single();
    if(ve||!v)throw new Error("Store not found.");vendor=v;
    const{data:rows,error:pe}=await getSupabase().from("products").select("id,code,name,price,category,description,in_stock,photo_url").eq("vendor_id",v.id);
    if(pe)throw pe;products=rows||[];const requestedCategory=getInitialCategory();activeCategory=(requestedCategory==="All"||products.some(p=>(p.category||"")===requestedCategory))?requestedCategory:"All";applyTheme(v.accent_color||"#2196F3");document.title=`${v.business_name||"Store"} — VEACASY`;render();
  }catch(err){app.className="error";app.innerHTML=`<h2>Store unavailable</h2><p>${escapeHtml(err.message||"This store could not be loaded.")}</p>`;}
}
loadStore();
</script>
</body>
</html>
